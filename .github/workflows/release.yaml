name: "🚀 Deploy Release (GoReleaser)"

on:
  push:
    tags:
      - "v*"
  # O release-pipeline chama este workflow depois de criar a tag: uma tag
  # empurrada pelo GITHUB_TOKEN não dispara o push acima.
  workflow_call:
    inputs:
      tag:
        description: "Tag da release (ex.: v5.7.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v5.7.0); vazio usa a ref escolhida"
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate-before-release:
    name: 🧪 Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.3.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.26.1"

      - name: 🏃 Run Tests
        run: go test ./... -v

      - name: 🏃 Run Tests (Sentinel, build tag k8s)
        # Polaris e OPA pesam na compilação: mesmo GOGC e limite de tempo do Lint K8s.
        env:
          GOGC: "30"
        run: go test -tags k8s -p 1 ./plugins/sentinel/...
        timeout-minutes: 15

      - name: 🏃 Run Tests (Viz, módulo próprio)
        working-directory: plugins/viz
        run: go test ./...

      - name: 🏃 Run Tests (Synapstor, módulo próprio)
        working-directory: plugins/synapstor
        run: go test ./...

  goreleaser:
    name: 🚀 Build & Publish
    runs-on: ubuntu-latest
    needs: [validate-before-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.26.1"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
