name: 🛡️ Release Pipeline (Validate & Finalize)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - "release/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: 🧪 Validate Release Branch
    runs-on: ubuntu-latest
    # Run on PR Open/Sync (Validate code before merging)
    if: github.event.action != 'closed'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.3.0

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.26"  # Resolve para última patch release (security fixes automáticos)

      - name: 🏃 Run Tests
        run: go test -race ./... -v

      - name: 🏃 Run Tests (Sentinel, build tag k8s)
        # Polaris e OPA pesam na compilação: mesmo GOGC e limite de tempo do Lint K8s.
        env:
          GOGC: "30"
        run: go test -race -tags k8s -p 1 ./plugins/sentinel/...
        timeout-minutes: 15

      - name: 🏃 Run Tests (Viz, módulo próprio)
        working-directory: plugins/viz
        run: go test -race ./...

      - name: 🏃 Run Tests (Synapstor, módulo próprio)
        working-directory: plugins/synapstor
        run: go test -race ./...

      - name: 🔒 Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go build -o /tmp/yby-check ./cmd/yby
          govulncheck -mode binary /tmp/yby-check || true
          echo "⚠️ Vulnerabilidades sem fix na série Go atual são reportadas mas não bloqueiam o pipeline."

      - name: ⬇️ Download Dependencies
        run: go mod download

      - name: 🔍 Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: 🔍 Lint Core (Fast)
        run: golangci-lint run --timeout=5m --exclude-dirs plugins/sentinel/cli,pkg/plugin/sdk

      - name: 🔍 Lint K8s (Isolated)
        env:
          GOGC: "30" # Aggressive GC for K8s lint
        run: golangci-lint run --build-tags k8s --timeout=5m --concurrency=1 plugins/sentinel/cli/... pkg/plugin/sdk/...
        timeout-minutes: 15

      - name: 🔍 Lint Viz (módulo próprio)
        working-directory: plugins/viz
        run: golangci-lint run --timeout=5m ./...

      - name: 🔍 Lint Synapstor (módulo próprio)
        working-directory: plugins/synapstor
        run: golangci-lint run --timeout=5m ./...

      - name: 📜 Lint Commits
        uses: wagoid/commitlint-github-action@v6.2.1
        with:
          configFile: commitlint.config.mjs

      - name: 🏗️ Verify GoReleaser Config
        uses: goreleaser/goreleaser-action@v6.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  finalize-release:
    name: 🚀 Finalize Release
    runs-on: ubuntu-latest
    # Only run on merged PRs to the release branch (The "Close" event)
    if: github.event.pull_request.merged == true
    outputs:
      release_version: ${{ steps.tag.outputs.release_version }}
    steps:
      - name: 📥 Checkout release branch
        uses: actions/checkout@v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Create Final Tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION=$(echo "${{ github.event.pull_request.base.ref }}" | sed -n 's,release/\(v[0-9]\+\.[0-9]\+\.[0-9]\+\),\1,p')

          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::Could not extract version from branch name: ${{ github.event.pull_request.base.ref }}"
            exit 1
          fi

          echo "Tagging $RELEASE_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: ↪️ Create Pull Request (Release -> Main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.base.ref }}
          RELEASE_VERSION: ${{ steps.tag.outputs.release_version }}
        run: |
          PR_TITLE="release: Release $RELEASE_VERSION"
          EXISTING_PR=$(gh pr list --head "$HEAD_REF" --base "main" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists."
          else
            gh pr create \
              --head "$HEAD_REF" \
              --base "main" \
              --title "$PR_TITLE" \
              --body "Final release PR for **$RELEASE_VERSION**. Merging this brings the release into main."
          fi

      - name: 🔄 Back-Merge (Release -> Develop)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          RELEASE_VERSION: ${{ steps.tag.outputs.release_version }}
        run: |
          # A develop é protegida e o GITHUB_TOKEN não fura a proteção. Em geral a
          # release só traz o commit de merge a mais; só abre PR se o conteúdo mudou.
          git fetch origin develop
          if git diff --quiet "origin/develop" "origin/$RELEASE_BRANCH"; then
            echo "✅ $RELEASE_BRANCH tem o mesmo conteúdo da develop; nada a voltar."
            exit 0
          fi
          EXISTING_PR=$(gh pr list --head "$RELEASE_BRANCH" --base "develop" --state open --json number -q '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --head "$RELEASE_BRANCH" \
              --base "develop" \
              --title "chore: Back-merge Release $RELEASE_VERSION to Develop" \
              --body "A $RELEASE_BRANCH tem mudanças que não estão na develop."
          fi
          echo "::warning::$RELEASE_BRANCH difere da develop; PR de volta aberto."

  publish-release:
    name: 📦 Publish Release (GoReleaser)
    needs: [finalize-release]
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.finalize-release.outputs.release_version }}
    secrets: inherit

  notify-failure:
    name: 🚨 Notify on Failure
    runs-on: ubuntu-latest
    needs: [finalize-release, publish-release]
    if: failure()
    steps:
      - name: 💬 Send notification
        run: |
          echo "The '${{ github.workflow }}' workflow failed."
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
